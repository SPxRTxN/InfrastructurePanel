# CI: тесты и аудит → сборка образа → smoke-тест → Trivy → публикация в GHCR (amd64 + arm64).
name: CI

on:
  push:
    branches: [Dashboard-Main, dev]
    # Теги v*.*.* публикует release.yml (образ X.Y.Z, X.Y, latest + GitHub Release) — здесь не дублируем
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements.lock
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: requirements.lock соответствует requirements.txt
        run: python tools/lock_deps.py --check
      - name: Готовые сборки зависимостей под amd64, arm64 и Windows (образ ставит только wheels)
        run: python tools/check_wheels.py --windows
      - run: pytest -q
      - name: homelab-agent и нативная установка панели
        # Отдельный venv: у агента свои версии psutil/websockets, окружение дашборда для аудита не трогаем
        run: |
          python -m venv "$RUNNER_TEMP/agent-venv"
          "$RUNNER_TEMP/agent-venv/bin/pip" install -q -r handoff/homelab-agent/requirements-dev.txt
          "$RUNNER_TEMP/agent-venv/bin/pytest" -q handoff/homelab-agent/tests deploy/native/tests
      - name: Аудит (bandit, pip-audit, git, vendor SHA256)
        run: python tools/audit.py --no-tests

  image:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      # Образ публикуется только из основной ветки и только в репозитории владельца (не из dev, PR и форков)
      PUBLISH: ${{ github.event_name == 'push' && github.ref != 'refs/heads/dev' && github.actor == github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Теги образа
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/Dashboard' || github.ref == 'refs/heads/Dashboard-Main' || startsWith(github.ref, 'refs/tags/v') }}

      - name: Сборка для smoke-теста (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: homelab-dashboard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-тест — контейнер с read-only ФС стартует и отвечает
        run: |
          key=$(python3 -c "import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())")
          docker run -d --name smoke --read-only --tmpfs /tmp --cap-drop ALL \
            -e SECRET_KEY="$key" -p 127.0.0.1:8000:8000 homelab-dashboard:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/healthz && break
            sleep 1
          done
          curl -fsS -o /dev/null http://127.0.0.1:8000/login
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/)" = 303
          docker logs smoke
          docker rm -f smoke

      - name: Сканирование уязвимостей образа (Trivy)
        # Образ Trivy вместо aquasecurity/trivy-action: теги экшена удаляли (0.28.0, 0.36.0 перестали
        # резолвиться), а образ сканера с фиксированной версией не зависит от тегов экшена.
        env:
          TRIVY_IMAGE: ${{ vars.TRIVY_IMAGE || 'ghcr.io/aquasecurity/trivy:0.58.1' }}
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE"
          image --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress homelab-dashboard:ci

      - name: Вход в GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Сборка и публикация (amd64 + arm64)
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
