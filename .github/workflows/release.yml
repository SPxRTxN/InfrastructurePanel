# Релиз по тегу vX.Y.Z: тесты → проверка версии → образ в GHCR (amd64 + arm64) + Trivy → GitHub Release с файлами.
# Как выпустить: CONTRIBUTING.md → «Выпуск релиза». Выпускает только владелец репозитория: тег от другого
# пользователя (даже с правом записи) пропускается, а теги v* защищены правилом (CONTRIBUTING.md → «Настройка GitHub»).
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    # Остальные задачи зависят от этой (needs) — при пропуске не запускаются и они
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements.lock
            requirements-dev.txt

      - name: Тег совпадает с версией приложения и CHANGELOG
        id: ver
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c "import re; print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('app/__init__.py').read()).group(1))")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Тег $TAG не совпадает с версией приложения $version (app/__init__.py). Поднимите __version__, закоммитьте и создайте тег v$version заново."
            exit 1
          fi
          if ! grep -q "^## $version " CHANGELOG.md; then
            echo "::error::В CHANGELOG.md нет раздела '## $version — дата'. Добавьте его и создайте тег заново."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: pip install -r requirements-dev.txt
      - name: requirements.lock соответствует requirements.txt
        run: python tools/lock_deps.py --check
      - name: Готовые сборки зависимостей под amd64, arm64 и Windows (образ ставит только wheels)
        run: python tools/check_wheels.py --windows
      - run: pytest -q
      - name: homelab-agent и нативная установка панели
        run: |
          python -m venv "$RUNNER_TEMP/agent-venv"
          "$RUNNER_TEMP/agent-venv/bin/pip" install -q -r handoff/homelab-agent/requirements-dev.txt
          "$RUNNER_TEMP/agent-venv/bin/pytest" -q handoff/homelab-agent/tests deploy/native/tests

  image:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Теги образа (X.Y.Z, X.Y, latest)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Сборка для проверки (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: homelab-dashboard:release
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-тест — контейнер с read-only ФС стартует, /healthz отдаёт версию
        env:
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          key=$(python3 -c "import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())")
          docker run -d --name smoke --read-only --tmpfs /tmp --cap-drop ALL \
            -e SECRET_KEY="$key" -p 127.0.0.1:8000:8000 homelab-dashboard:release
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/healthz | grep -q "\"$VERSION\""
          docker logs smoke
          docker rm -f smoke

      - name: Сканирование уязвимостей образа (Trivy)
        # Образом сканера с фиксированной версией, как в ci.yml (теги trivy-action удаляли)
        env:
          TRIVY_IMAGE: ${{ vars.TRIVY_IMAGE || 'ghcr.io/aquasecurity/trivy:0.58.1' }}
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE"
          image --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress homelab-dashboard:release

      - name: Вход в GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Сборка и публикация (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [test, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Архивы, SHA256SUMS и текст релиза из CHANGELOG
        run: python tools/build_release.py --out dist --notes dist/notes.md
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: dist/notes.md
          files: |
            dist/homelab-agent-*.tar.gz
            dist/homelab-agent-*.zip
            dist/homelab-dashboard-native-*.tar.gz
            dist/SHA256SUMS
