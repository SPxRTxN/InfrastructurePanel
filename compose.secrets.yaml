# Секреты из файлов вместо переменных окружения (аудит S-05): не видны в `docker inspect`
# и /proc/<pid>/environ. Подключение — строки в .env рядом с compose.yaml:
#   COMPOSE_FILE=compose.yaml:compose.secrets.yaml
#   SECRETS_DIR=/путь/вне/data          (по умолчанию ./secrets)
# Файлы (права 0700 на каталог, 0600 на файлы, владелец — тот, кто запускает deploy.sh). Все должны существовать;
# пустой файл = настройка выключена:
#   secret_key            — ключ Fernet (тот же, что был в SECRET_KEY; из .env его затем удалить)
#   db_encryption_key     — 64 hex, шифрование всей БД SQLCipher (существующую БД сначала: app.cli encrypt-db)
#   password_pepper       — «перец» паролей (потеряете — никто не войдёт; восстановление: app.cli create-admin)
#   first_admin_password  — пароль admin на пустой БД (после первого входа можно очистить)
# Держите SECRETS_DIR на другом диске/томе, чем ./data (лучше — tmpfs, заполняемый при загрузке):
# тогда копия data/ и бэкапы без него бесполезны.
services:
  dashboard:
    environment:
      SECRET_KEY_FILE: /run/secrets/secret_key
      DB_ENCRYPTION_KEY_FILE: /run/secrets/db_encryption_key
      PASSWORD_PEPPER_FILE: /run/secrets/password_pepper
      FIRST_ADMIN_PASSWORD_FILE: /run/secrets/first_admin_password
    secrets:
      - secret_key
      - db_encryption_key
      - password_pepper
      - first_admin_password

secrets:
  secret_key:
    file: ${SECRETS_DIR:-./secrets}/secret_key
  db_encryption_key:
    file: ${SECRETS_DIR:-./secrets}/db_encryption_key
  password_pepper:
    file: ${SECRETS_DIR:-./secrets}/password_pepper
  first_admin_password:
    file: ${SECRETS_DIR:-./secrets}/first_admin_password
